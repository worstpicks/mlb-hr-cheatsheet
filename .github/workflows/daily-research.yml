name: Daily research update

on:
  # 3:07 AM Eastern, after the last West Coast games are final, so the research
  # tabs carry last night's games by morning. GitHub's clock is UTC and Eastern
  # moves an hour twice a year, so there is a trigger for each offset; the gate
  # job lets only the first one at or after 3 AM Eastern publish each day.
  # Seven past the hour, not on it: GitHub queues top-of-the-hour jobs longest.
  schedule:
    - cron: '7 7 * * *'   # 3:07 AM EDT (2:07 AM EST: too early, gated off)
    - cron: '7 8 * * *'   # 3:07 AM EST (4:07 AM EDT: already published, skipped)
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the individual manual/push workflows, which also write data.
concurrency:
  group: research-publish
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Once a day, at or after 3 AM Eastern
        id: check
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          HOUR=$(TZ=America/New_York date +%-H)
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0      # Run workflow by hand: always
          fi
          if [ "$HOUR" -lt 3 ]; then
            echo "It is $HOUR:xx Eastern; the 3 AM trigger takes today's update."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$(git log -1 --format=%h --fixed-strings --grep="Daily NBA, NFL and NHL research for $TODAY")" ]; then
            echo "Today's research is already published."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: nba_research/cache
          key: nba-cache-${{ github.run_id }}
          restore-keys: nba-cache-
      - uses: actions/cache@v4
        with:
          path: nhl_research/cache
          key: nhl-cache-${{ github.run_id }}
          restore-keys: nhl-cache-
      - name: Install NFL dependencies
        id: nfl_dependencies
        continue-on-error: true
        run: pip install --quiet nflreadpy==0.1.5 polars==1.42.1
      - name: Set Eastern date
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          echo "DATE=$TODAY" >> "$GITHUB_ENV"
          echo "NHL_TODAY=$TODAY" >> "$GITHUB_ENV"
      - name: Build NBA research
        id: nba
        continue-on-error: true
        run: |
          START=$(date -d "$DATE -1 day" +%F)
          python -m nba_research.build_slate --date "$START" --days 5
      - name: Build NFL research
        id: nfl
        if: steps.nfl_dependencies.outcome == 'success'
        continue-on-error: true
        run: python fetch-nfl-research-slate.py --season 2026 --week current --ahead 1
      - name: Build NHL research
        id: nhl
        continue-on-error: true
        run: python fetch-nhl-research-slate.py --date "$DATE" --days 4 --prune 7
      - name: Build NHL cheat sheets
        id: sheets
        continue-on-error: true
        run: |
          FAILED=0
          for offset in 0 1 2 3; do
            D=$(date -d "$DATE +$offset day" +%F)
            if [ -f "nhl_research/atgs_days/$D.txt" ] && [ -f "preview/data/nhl-research-$D.json" ]; then
              python -m nhl_research.atgs_sheet --date "$D" || FAILED=1
            fi
          done
          exit "$FAILED"
      # After the research builds, so each line lands on the slates' own game ids.
      # Tonight's lines (The Rundown, free plan) and yesterday's results (ESPN); never fails the run.
      - name: Pull game lines and results (The Rundown, ESPN)
        continue-on-error: true
        env:
          RUNDOWN_API_KEY: ${{ secrets.RUNDOWN_API_KEY }}
        run: python research_lines.py --date "$DATE"
      # After the lines, so tonight's projection is set against the book's number.
      - name: NBA game model (our projected score, spread and total)
        continue-on-error: true
        run: python -m nba_research.game_model --date "$DATE"
      - name: Publish all changed research in one commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'preview/data/nba-research-*.json' 'preview/data/nfl-research-*.json' 'preview/data/nhl-research-*.json' 'preview/data/lines-*.json' 'preview/data/results-*.json' 'preview/data/nba-game-model-*.json' preview/nhl-research
          if git diff --cached --quiet; then
            echo "No research changed; no production deployment needed."
            exit 0
          fi
          git commit -m "Daily NBA, NFL and NHL research for $DATE"
          for attempt in 1 2 3; do
            # Never overwrite a concurrent editor's changes to resolve a clash.
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Report any incomplete research
        if: >-
          always() &&
          (steps.nfl_dependencies.outcome == 'failure' ||
           steps.nba.outcome == 'failure' || steps.nfl.outcome == 'failure' ||
           steps.nhl.outcome == 'failure' || steps.sheets.outcome == 'failure')
        run: |
          echo "::error::Some research failed. Successfully generated files were still offered for publication; inspect the failed steps."
          exit 1
